<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="960" height="500" fill="#ffffff"/>

  <text x="480" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">CC207S bus interface – block diagram (author's build)</text>
  <text x="480" y="43" text-anchor="middle" font-size="11" fill="#c9701a">Orange text = value NOT verified by the author's notes: measure / confirm before copying.</text>
  <text x="480" y="59" text-anchor="middle" font-size="10" fill="#666666">Brown = 16 V VCC    Red = 5 V (VIN + BSS138 HV)    Magenta = 3.3 V (BSS138 LV)    Blue = data (3.3 V logic)    Yellow = common GND</text>

  <!-- Heat pump container -->
  <rect x="50" y="78" width="195" height="235" rx="4" fill="#eef2f7" stroke="#8a9bb0" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="66" y="101" font-size="13.5" font-weight="bold" fill="#1a1a1a">Heat pump</text>
  <text x="66" y="117" font-size="11" fill="#555555">CC207S controller board</text>

  <rect x="65" y="132" width="165" height="38" rx="3" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="147.5" y="155" text-anchor="middle" font-size="12.5" fill="#1a1a1a">DC rail ~16 V (brown)</text>

  <rect x="65" y="188" width="165" height="38" rx="3" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="147.5" y="211" text-anchor="middle" font-size="12.5" fill="#1a1a1a">Bus data (blue)</text>

  <rect x="65" y="244" width="165" height="38" rx="3" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="147.5" y="267" text-anchor="middle" font-size="12.5" fill="#1a1a1a">GND (yellow)</text>

  <line x1="120" y1="282" x2="120" y2="308" stroke="#8a9bb0" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="66" y="326" font-size="10.5" fill="#c9701a">Keypad connector on board: CN3</text>
  <text x="66" y="340" font-size="10.5" fill="#c9701a">Bus data ~4.4 V idle (5 V logic)</text>

  <!-- Buck converter -->
  <rect x="300" y="104" width="160" height="72" rx="4" fill="#eaf7ee" stroke="#3f9150" stroke-width="1.3"/>
  <text x="380" y="125" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a1a1a">Buck MP1584EN mini</text>
  <text x="380" y="144" text-anchor="middle" font-size="10.5" fill="#2f7a3e">fixed 5 V out, IN 4.5-28 V</text>
  <text x="380" y="159" text-anchor="middle" font-size="10.5" fill="#2f7a3e">IN ~16 V from brown wire</text>

  <!-- BSS138 level shifter -->
  <rect x="300" y="210" width="160" height="148" rx="4" fill="#eaf7ee" stroke="#3f9150" stroke-width="1.3"/>
  <text x="380" y="230" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a1a1a">BSS138 level shifter</text>
  <text x="380" y="246" text-anchor="middle" font-size="10.5" fill="#555555">4-channel module</text>
  <text x="380" y="260" text-anchor="middle" font-size="10.5" fill="#555555">channel 1 used (HV1 - LV1)</text>

  <text x="315" y="286" font-size="11.5" fill="#1a1a1a">HV</text>
  <text x="445" y="286" text-anchor="end" font-size="11.5" fill="#1a1a1a">LV</text>
  <text x="315" y="308" font-size="11.5" fill="#1a1a1a">HV1</text>
  <text x="445" y="308" text-anchor="end" font-size="11.5" fill="#1a1a1a">LV1</text>
  <text x="315" y="330" font-size="11.5" fill="#1a1a1a">GND</text>
  <text x="445" y="330" text-anchor="end" font-size="11.5" fill="#1a1a1a">GND</text>

  <!-- ESP32 -->
  <rect x="520" y="104" width="200" height="230" rx="4" fill="#eaf7ee" stroke="#3f9150" stroke-width="1.3"/>
  <text x="620" y="126" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1a1a1a">ESP32 (WROOM)</text>
  <text x="620" y="142" text-anchor="middle" font-size="10.5" fill="#555555">mini D1 style board</text>

  <text x="540" y="176" font-size="12.5" fill="#1a1a1a">5 V / VIN</text>
  <text x="540" y="208" font-size="12.5" fill="#1a1a1a">3V3</text>
  <text x="540" y="240" font-size="12.5" fill="#1a1a1a">GPIO27 = pin_txrx</text>
  <text x="540" y="309" font-size="12.5" fill="#1a1a1a">GND</text>

  <!-- Capacitor -->
  <rect x="760" y="150" width="150" height="68" rx="4" fill="#eaf7ee" stroke="#3f9150" stroke-width="1.3"/>
  <text x="835" y="174" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Capacitor (optional)</text>
  <text x="835" y="192" text-anchor="middle" font-size="10.5" fill="#555555">on ESP32 5 V pin</text>
  <text x="835" y="206" text-anchor="middle" font-size="10.5" fill="#555555">value not critical</text>

  <!-- Keypad -->
  <rect x="55" y="400" width="195" height="68" rx="10" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.3"/>
  <text x="152.5" y="429" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1a1a1a">Keypad</text>
  <text x="152.5" y="447" text-anchor="middle" font-size="11" fill="#555555">(stays connected)</text>

  <!-- GND note -->
  <text x="265" y="395" font-size="11" fill="#1a1a1a">Yellow = common GND (all four)</text>
  <text x="265" y="409" font-size="11" fill="#1a1a1a">(no second, separately powered supply)</text>
  <text x="265" y="423" font-size="11" fill="#1a1a1a">Buck, BSS138, ESP32, capacitor all tied here.</text>

  <!-- Do NOT box -->
  <rect x="560" y="395" width="285" height="80" rx="4" fill="#fdecec" stroke="#c74343" stroke-width="1.3"/>
  <text x="576" y="415" font-size="12.5" font-weight="bold" fill="#a62d2d">Do NOT:</text>
  <text x="576" y="432" font-size="10.5" fill="#a62d2d">• power the ESP32 from another supply (ground loop,</text>
  <text x="586" y="446" font-size="10.5" fill="#a62d2d">see "Lesson learned" in wiring.md)</text>
  <text x="576" y="461" font-size="10.5" fill="#a62d2d">• put the ESP32 inside the metal heat-pump cabinet</text>

  <!-- Brown VCC: DC rail -> Buck -->
  <line x1="230" y1="151" x2="300" y2="151" stroke="#8b5a2b" stroke-width="2"/>
  <text x="265" y="143" text-anchor="middle" font-size="10" fill="#8b5a2b">brown: VCC</text>

  <!-- Blue bus data: Bus data -> BSS138 HV1 -->
  <polyline points="230,207 255,207 255,308 300,308" fill="none" stroke="#2a6fdb" stroke-width="2"/>
  <text x="243" y="199" text-anchor="middle" font-size="10" fill="#2a6fdb">blue: data</text>

  <!-- Red 5V: single Buck output pin, split to ESP32 VIN and BSS138 HV -->
  <polyline points="460,176 520,176" fill="none" stroke="#cc3333" stroke-width="2"/>
  <polyline points="460,176 460,196 285,196 285,286 300,286" fill="none" stroke="#cc3333" stroke-width="2"/>
  <circle cx="460" cy="176" r="3.2" fill="#cc3333"/>

  <!-- Magenta 3.3V supply: ESP32 3V3 -> BSS138 LV -->
  <polyline points="520,208 495,208 495,286 460,286" fill="none" stroke="#b5179e" stroke-width="2"/>
  <text x="505" y="198" text-anchor="middle" font-size="10" fill="#b5179e">3.3V</text>

  <!-- Blue data signal: ESP32 GPIO27 -> BSS138 LV1 -->
  <polyline points="520,240 505,240 505,308 460,308" fill="none" stroke="#2a6fdb" stroke-width="2"/>
  <text x="463" y="303" font-size="10" fill="#2a6fdb">data</text>

  <!-- Capacitor VIN tap (dashed, optional) -->
  <line x1="760" y1="176" x2="720" y2="176" stroke="#cc3333" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Yellow GND bus -->
  <polyline points="230,263 272,263 272,372 800,372" fill="none" stroke="#c9a227" stroke-width="2.2"/>
  <polyline points="305,176 293,176 293,372" fill="none" stroke="#c9a227" stroke-width="2.2"/>
  <polyline points="330,358 330,372" fill="none" stroke="#c9a227" stroke-width="2.2"/>
  <polyline points="450,358 450,372" fill="none" stroke="#c9a227" stroke-width="2.2"/>
  <polyline points="540,334 540,372" fill="none" stroke="#c9a227" stroke-width="2.2"/>
  <line x1="800" y1="218" x2="800" y2="372" stroke="#c9a227" stroke-width="1.8" stroke-dasharray="4 3"/>
</svg>
